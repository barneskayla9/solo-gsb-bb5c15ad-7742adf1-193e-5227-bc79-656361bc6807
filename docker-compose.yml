services:
  db:
    image: postgres:16-alpine
    container_name: water-db
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: water_network
    ports:
      - "5432:5432"
    volumes:
      - water_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water_network"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: water-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://water:water@db:5432/water_network
      SEED_DEMO: "true"
    ports:
      - "8000:8000"

volumes:
  water_pgdata:
